<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilmCore Email Signatures</title>
<style>
  :root { --bg: #f4f5f9; --panel: #ffffff; --fg: #2b2c34; --muted: #6b6e86; --line: #dcdee8; --accent: #4f72d9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161c; --panel: #1e1f27; --fg: #e6e7ee; --muted: #9a9db3; --line: #2f313d; --accent: #7d97ec; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 16px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
  a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; color: var(--fg); text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card b { color: var(--accent); }
  a.card span { display: block; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ilmCore Email Signatures</h1>
  <a class="card" href="personal.html"><b>Personal signature</b><span>Enter an employee's name, title, email and phone, then copy it into Gmail or download a file.</span></a>
  <a class="card" href="general.html"><b>General signature</b><span>Company-wide signature for shared and automated mailboxes.</span></a>
</div>
</body>
</html>
